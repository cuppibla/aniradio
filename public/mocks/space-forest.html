<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aniradio · forest at dusk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --ink: #e8e0d4;
    --ink-soft: #e8e0d4aa;
    --ink-faint: #e8e0d455;
    --gold: #ffd98a;
    --amber: #c9a155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0f0a;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }

  /* dusk sky */
  .room {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 65% 78%, rgba(201,161,85,0.55) 0%, transparent 40%),
      radial-gradient(ellipse at 30% 60%, rgba(180,120,80,0.18) 0%, transparent 50%),
      linear-gradient(180deg, #1a2e3a 0%, #1e342e 40%, #3a3a28 70%, #5c4426 100%);
  }

  /* the sun, low behind trees */
  .sun {
    position: absolute;
    bottom: 18%;
    left: 64%;
    width: 90px;
    height: 90px;
    border-radius: 999px;
    background: radial-gradient(circle, #ffe8b0 0%, #ffb86a 50%, transparent 75%);
    filter: blur(2px);
    opacity: 0.85;
  }

  /* drifting cloud band */
  .clouds {
    position: absolute;
    top: 25%; left: -10%; right: -10%;
    height: 80px;
    background: radial-gradient(ellipse at 20% 50%, rgba(255,220,180,0.08) 0%, transparent 30%),
                radial-gradient(ellipse at 50% 50%, rgba(255,220,180,0.06) 0%, transparent 25%),
                radial-gradient(ellipse at 80% 50%, rgba(255,220,180,0.07) 0%, transparent 28%);
    filter: blur(10px);
    animation: drift-clouds 60s linear infinite;
  }
  @keyframes drift-clouds {
    from { transform: translateX(0); }
    to { transform: translateX(-150px); }
  }

  /* treeline — three layers for depth */
  .treeline {
    position: absolute;
    left: 0; right: 0;
    width: 100%;
    overflow: visible;
  }
  .treeline svg { display: block; width: 100%; height: auto; }

  .treeline.back { bottom: 28%; opacity: 0.45; filter: blur(0.5px); }
  .treeline.mid  { bottom: 18%; opacity: 0.75; }
  .treeline.front { bottom: 0; opacity: 1; }

  /* drifting fireflies */
  .firefly {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 999px;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(255,217,138,0.4);
    animation: float 8s ease-in-out infinite, fly 18s linear infinite;
    opacity: 0.7;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  @keyframes fly {
    0% { left: 10%; }
    100% { left: 90%; }
  }

  /* DJ Sora — a single bigger warm lantern that breathes, slowly drifting */
  .sora {
    position: absolute;
    bottom: 28%;
    left: 38%;
    width: 56px; height: 56px;
    z-index: 8;
    animation: sora-drift 22s ease-in-out infinite;
  }
  @keyframes sora-drift {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(20px, -8px); }
    66% { transform: translate(-15px, 10px); }
  }
  .sora-glow {
    position: absolute; inset: -20px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(255,200,140,0.55) 0%, rgba(255,160,100,0.25) 40%, transparent 70%);
    filter: blur(8px);
    animation: sora-breathe 5s ease-in-out infinite;
  }
  @keyframes sora-breathe {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  .sora-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: radial-gradient(circle, #fff2d6 0%, #ffc09c 70%, transparent 90%);
    filter: blur(1px);
  }
  .sora-label {
    position: absolute;
    bottom: -28px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: rgba(255,217,138,0.6);
    white-space: nowrap;
  }

  /* small distant lanterns to suggest others have been in this room */
  .distant-light {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 999px;
    background: rgba(255,180,120,0.7);
    box-shadow: 0 0 6px rgba(255,180,120,0.5);
    opacity: 0.6;
  }

  /* header */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
  }
  .back {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--ink-faint);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .back:hover { color: var(--ink); }
  .room-title { text-align: center; }
  .room-title h1 {
    font-family: ui-serif, Georgia, serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink);
  }
  .room-title .dj-name {
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.3em;
    margin-top: 4px;
  }
  .room-time {
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.25em;
  }

  /* waveform — minimal soundscape visualizer, floats just above bottom info bar */
  .waveform {
    position: fixed;
    bottom: 130px;
    left: 0; right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    z-index: 9;
    opacity: 0.45;
  }
  .waveform .bar {
    width: 2px;
    background: var(--ink-soft);
    border-radius: 1px;
    animation: wave 2s ease-in-out infinite;
  }
  .waveform .bar:nth-child(odd) { animation-duration: 2.4s; }
  .waveform .bar:nth-child(3n) { animation-duration: 1.7s; }
  .waveform .bar:nth-child(5n) { animation-duration: 3.1s; animation-delay: -0.4s; }
  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 22px; }
  }

  /* bottom info bar */
  .info-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 26px 32px 30px;
    background: linear-gradient(to top, rgba(10,15,10,0.9) 0%, rgba(10,15,10,0.5) 50%, transparent 100%);
  }
  .ticker {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }
  .ticker .pulse {
    width: 6px; height: 6px;
    border-radius: 999px;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(255,217,138,0.8);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .ticker .next {
    margin-left: auto;
    color: var(--ink-faint);
  }
  .track-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }
  .track-title {
    font-family: ui-serif, Georgia, serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
  }
  .track-by {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .controls { display: flex; gap: 8px; }
  .ctrl {
    width: 38px; height: 38px;
    border-radius: 999px;
    border: 1px solid rgba(232,224,212,0.18);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .ctrl:hover { border-color: var(--ink-soft); color: var(--ink); }
</style>
</head>
<body>

<div class="room">
  <div class="clouds"></div>
  <div class="sun"></div>

  <!-- back layer of trees (smaller, fainter, distant) -->
  <div class="treeline back">
    <svg viewBox="0 0 1400 200" preserveAspectRatio="none">
      <path d="M0,200 L0,140 L60,90 L100,140 L160,80 L210,140 L260,100 L320,150 L380,90 L430,140 L490,75 L550,140 L610,100 L670,150 L740,85 L810,140 L870,95 L940,150 L1010,75 L1080,140 L1150,95 L1220,150 L1290,85 L1360,140 L1400,100 L1400,200 Z" fill="#0a1d10"/>
    </svg>
  </div>

  <!-- mid layer -->
  <div class="treeline mid">
    <svg viewBox="0 0 1400 240" preserveAspectRatio="none">
      <path d="M0,240 L0,160 L70,80 L130,150 L200,60 L270,150 L340,70 L410,150 L470,90 L540,160 L610,55 L690,160 L760,90 L820,160 L890,60 L960,150 L1030,80 L1100,160 L1170,70 L1240,150 L1310,80 L1380,160 L1400,140 L1400,240 Z" fill="#08160c"/>
    </svg>
  </div>

  <!-- front layer (tallest, darkest, closest) -->
  <div class="treeline front">
    <svg viewBox="0 0 1400 280" preserveAspectRatio="none">
      <path d="M0,280 L0,180 L80,40 L160,180 L240,30 L320,180 L400,50 L480,180 L560,20 L640,180 L720,60 L800,180 L880,35 L960,180 L1040,45 L1120,180 L1200,20 L1280,180 L1360,55 L1400,180 L1400,280 Z" fill="#040a06"/>
    </svg>
  </div>

  <header>
    <a href="lobby.html" class="back">← leave room</a>
    <div class="room-title">
      <h1>白噪音 · 大自然 · forest at dusk</h1>
      <div class="dj-name">with Sora</div>
    </div>
    <div class="room-time">tuesday · 11:42 pm</div>
  </header>

  <!-- DJ Sora -->
  <div class="sora">
    <div class="sora-glow"></div>
    <div class="sora-core"></div>
    <div class="sora-label">Sora</div>
  </div>

  <!-- fireflies -->
  <div class="firefly" style="top:35%; animation-delay: 0s, 0s;"></div>
  <div class="firefly" style="top:42%; animation-delay: 2s, 4s;"></div>
  <div class="firefly" style="top:55%; animation-delay: 4s, 2s;"></div>
  <div class="firefly" style="top:48%; animation-delay: 1s, 8s;"></div>
  <div class="firefly" style="top:62%; animation-delay: 3s, 12s;"></div>
  <div class="firefly" style="top:38%; animation-delay: 6s, 6s;"></div>

  <!-- distant lanterns (others in this room earlier in the week) -->
  <div class="distant-light" style="top: 55%; left: 12%;"></div>
  <div class="distant-light" style="top: 50%; left: 78%;"></div>
  <div class="distant-light" style="top: 60%; left: 88%;"></div>

  <!-- waveform visualizer (40 bars) -->
  <div class="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="info-bar">
    <div class="ticker">
      <span class="pulse"></span>
      <span>now playing · soundscape 3 of ∞ · channel mode</span>
      <span class="next">next: wet moss at dawn · then: cicadas, still air</span>
    </div>
    <div class="track-row">
      <div>
        <div class="track-title">redwoods after rain</div>
        <div class="track-by">field recording · 22 minutes · Lyria 3 Pro</div>
      </div>
      <div class="controls">
        <button class="ctrl" aria-label="pause">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <rect x="2.5" y="2" width="2.5" height="8" rx="0.5"/>
            <rect x="7" y="2" width="2.5" height="8" rx="0.5"/>
          </svg>
        </button>
        <button class="ctrl" aria-label="skip">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <path d="M2 2v8l5-4-5-4zm6 0v8h2V2H8z"/>
          </svg>
        </button>
        <button class="ctrl" aria-label="info">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="6" cy="6" r="4.5"/>
            <line x1="6" y1="5" x2="6" y2="9"/>
            <circle cx="6" cy="3.5" r="0.4" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

</body>
